workflows:
  # Development workflow - runs on every push
  development:
    name: Development Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.taxidispatch.taxi_dispatch_app"
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'develop'
          include: true
          source: true
    
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Analyze code
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test
      
      - name: Build Android APK
        script: |
          flutter build apk --debug
      
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --debug --no-codesign
    
    artifacts:
      - build/app/outputs/**/*.apk
      - build/ios/ipa/*.ipa
    
    publishing:
      email:
        recipients:
          - dev-team@taxidispatch.com
        notify:
          success: false
          failure: true

  # Android Release workflow
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - firebase_credentials
        - android_signing
        - google_play
      vars:
        PACKAGE_NAME: "com.taxidispatch.taxi_dispatch_app"
    
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    
    scripts:
      - name: Set up keystore
        script: |
          echo $KEYSTORE_BASE64 | base64 --decode > $CM_BUILD_DIR/keystore.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          RELEASE_STORE_FILE=$CM_BUILD_DIR/keystore.jks
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run tests
        script: |
          flutter test
      
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
      
      - name: Build Android APK
        script: |
          flutter build apk --release
    
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
    
    publishing:
      email:
        recipients:
          - dev-team@taxidispatch.com
        notify:
          success: true
          failure: true
      
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        track: internal
        submit_as_draft: true

  # iOS Release workflow
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
        - ios_signing
        - app_store_connect
      vars:
        BUNDLE_ID: "com.taxidispatch.taxi-dispatch-app"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
    
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      
      - name: Run tests
        script: |
          flutter test
      
      - name: Build iOS
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    
    publishing:
      email:
        recipients:
          - dev-team@taxidispatch.com
        notify:
          success: true
          failure: true
      
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        submit_to_app_store: false
